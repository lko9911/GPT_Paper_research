name: Update papers

on:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-data-writes
  cancel-in-progress: false

jobs:
  update:
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write update status started
        env:
          UPDATE_PHASE: "in_progress"
          UPDATE_JOB_STATUS: "in_progress"
          UPDATE_STEP_OUTCOME: "running"
          COMMIT_STEP_OUTCOME: "pending"
          DEPLOY_STEP_OUTCOME: "pending"
          UPDATE_CRON_DESCRIPTION: "17 1,7,13,19 * * *"
        run: python scripts/write_update_status.py

      - name: Commit update status started
        run: |
          if git diff --quiet -- UPDATE_STATUS.md data/update_status.json; then
            echo "No update status changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UPDATE_STATUS.md data/update_status.json
          git commit -m "Mark paper update in progress"
          git push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Update papers
        id: update_papers
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          ALLOW_OPENAI_IN_UPDATE: "false"
          SINCE_YEAR: "2024"
          API_SLEEP_SECONDS: "1.0"
          CROSSREF_MAX_PAGES: "1"
        run: python scripts/full_rebuild_crossref_dataset.py

      - name: Build split data
        run: python scripts/build_split_data.py

      - name: Commit changed data
        id: commit_data
        run: |
          if git diff --quiet -- data/papers.json data/archive_papers.json data/papers.csv data/papers.xlsx data/site_meta.json data/old_exports data/papers_index.json data/archive_papers_index.json data/detail_manifest.json data/archive_detail_manifest.json data/details data/archive_details; then
            echo "No paper data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.json data/archive_papers.json data/papers.csv data/site_meta.json data/old_exports data/papers_index.json data/archive_papers_index.json data/detail_manifest.json data/archive_detail_manifest.json data/details data/archive_details
          git add -f data/papers.xlsx
          git commit -m "Update paper metadata"
          git pull --rebase --autostash origin main
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write update status
        if: always()
        env:
          UPDATE_JOB_STATUS: ${{ job.status }}
          UPDATE_STEP_OUTCOME: ${{ steps.update_papers.outcome }}
          COMMIT_STEP_OUTCOME: ${{ steps.commit_data.outcome }}
          DEPLOY_STEP_OUTCOME: ${{ steps.deployment.outcome }}
          UPDATE_CRON_DESCRIPTION: "17 1,7,13,19 * * *"
        run: python scripts/write_update_status.py

      - name: Commit update status
        if: always()
        run: |
          if git diff --quiet -- UPDATE_STATUS.md data/update_status.json; then
            echo "No update status changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UPDATE_STATUS.md data/update_status.json
          git commit -m "Update workflow status"
          git pull --rebase --autostash origin main
          git push
