name: Update papers

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  update:
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Update papers
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          ALLOW_OPENAI_IN_UPDATE: "false"
          SINCE_YEAR: "2024"
          API_SLEEP_SECONDS: "1.0"
          OPENALEX_MAX_PAGES: "2"
          CROSSREF_MAX_PAGES: "1"
        run: python scripts/update_papers.py

      - name: Commit changed data
        run: |
          if git diff --quiet -- data/papers.json data/archive_papers.json data/site_meta.json; then
            echo "No paper data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.json data/archive_papers.json data/site_meta.json
          git commit -m "Update paper metadata"
          git pull --rebase --autostash origin main
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
