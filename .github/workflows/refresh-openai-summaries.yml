name: OpenAI summary refresh

on:
  workflow_dispatch:
    inputs:
      max_summaries:
        description: "Maximum curated papers to refresh in this run. Cost-control guard; use 25 for tests."
        required: true
        default: "25"
      refresh_mode:
        description: "metadata refreshes only fallback/metadata summaries; non_qa refreshes summaries not already in 5-question format; all refreshes every paper."
        required: true
        default: "non_qa"
        type: choice
        options:
          - non_qa
          - metadata
          - all
          - missing
      dry_run:
        description: "Run without writing data changes."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      confirm_openai_cost:
        description: "Required cost guard. Select true only when you intentionally want to call the OpenAI API."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: openai-summary-refresh
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write OpenAI summary status started
        env:
          OPENAI_SUMMARY_PHASE: "in_progress"
          OPENAI_JOB_STATUS: "in_progress"
          CONFIRM_STEP_OUTCOME: "pending"
          REFRESH_STEP_OUTCOME: "pending"
          COMMIT_STEP_OUTCOME: "pending"
          DEPLOY_STEP_OUTCOME: "pending"
          MAX_OPENAI_SUMMARIES: ${{ inputs.max_summaries }}
          REFRESH_MODE: ${{ inputs.refresh_mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_OPENAI_COST: ${{ inputs.confirm_openai_cost }}
        run: python scripts/write_openai_summary_status.py

      - name: Commit OpenAI summary status started
        run: |
          if git diff --quiet -- OPENAI_SUMMARY_STATUS.md data/openai_summary_status.json; then
            echo "No OpenAI summary status changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OPENAI_SUMMARY_STATUS.md data/openai_summary_status.json
          git commit -m "Mark OpenAI summary refresh in progress"
          git pull --rebase --autostash origin main
          git push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Confirm explicit OpenAI request
        id: confirm_openai
        env:
          HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "${{ inputs.confirm_openai_cost }}" != "true" ]; then
            echo "OpenAI summary refresh is blocked. Re-run with confirm_openai_cost=true only when you intentionally want to call the OpenAI API."
            exit 1
          fi
          if [ "$HAS_OPENAI_API_KEY" != "true" ]; then
            echo "OPENAI_API_KEY is not configured in repository secrets."
            exit 1
          fi

      - name: Refresh summaries with OpenAI
        id: refresh_summaries
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          MAX_OPENAI_SUMMARIES: ${{ inputs.max_summaries }}
          REFRESH_MODE: ${{ inputs.refresh_mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          API_SLEEP_SECONDS: "1.0"
          OPENAI_REFRESH_SLEEP_SECONDS: "0.5"
        run: python scripts/refresh_openai_summaries.py

      - name: Commit refreshed summaries
        id: commit_summaries
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          if git diff --quiet -- data/papers.json data/site_meta.json; then
            echo "No summary changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.json data/site_meta.json
          git commit -m "Refresh OpenAI paper summaries"
          git pull --rebase --autostash origin main
          git push

      - name: Setup Pages
        if: ${{ inputs.dry_run == 'false' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ inputs.dry_run == 'false' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: ${{ inputs.dry_run == 'false' }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write OpenAI summary status
        if: always()
        env:
          OPENAI_JOB_STATUS: ${{ job.status }}
          OPENAI_SUMMARY_PHASE: "completed"
          CONFIRM_STEP_OUTCOME: ${{ steps.confirm_openai.outcome }}
          REFRESH_STEP_OUTCOME: ${{ steps.refresh_summaries.outcome }}
          COMMIT_STEP_OUTCOME: ${{ steps.commit_summaries.outcome }}
          DEPLOY_STEP_OUTCOME: ${{ steps.deployment.outcome }}
          MAX_OPENAI_SUMMARIES: ${{ inputs.max_summaries }}
          REFRESH_MODE: ${{ inputs.refresh_mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_OPENAI_COST: ${{ inputs.confirm_openai_cost }}
        run: python scripts/write_openai_summary_status.py

      - name: Commit OpenAI summary status
        if: always()
        run: |
          if git diff --quiet -- OPENAI_SUMMARY_STATUS.md data/openai_summary_status.json; then
            echo "No OpenAI summary status changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OPENAI_SUMMARY_STATUS.md data/openai_summary_status.json
          git commit -m "Update OpenAI summary workflow status"
          git pull --rebase --autostash origin main
          git push
