name: AML Recommendation Manual

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "AML recommendation mode"
        required: true
        default: "score_existing"
        type: choice
        options:
          - score_existing
          - collect_and_score
          - full_refresh
      max_candidates:
        description: "Maximum AML candidate papers to score. Use 0 or blank to score all collected candidates."
        required: false
        default: "0"
      use_ai_judge:
        description: "Use OpenAI relevance judge for ambiguous candidates"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      use_ai_reason:
        description: "Use OpenAI to write public AML recommendation reasons from structured metadata"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      publish_output:
        description: "Commit public AML recommendation output"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: aml-recommendation-manual
  cancel-in-progress: false

jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Restore private AML seed file
        env:
          AML_SEED_PAPERS_JSON_B64: ${{ secrets.AML_SEED_PAPERS_JSON_B64 }}
          AML_SEED_PAPERS_JSON: ${{ secrets.AML_SEED_PAPERS_JSON }}
        run: |
          mkdir -p data/private
          if [ -n "$AML_SEED_PAPERS_JSON_B64" ]; then
            printf '%s' "$AML_SEED_PAPERS_JSON_B64" | base64 -d > data/private/aml_seed_papers_core_enriched.json
            echo "Restored AML seed file from AML_SEED_PAPERS_JSON_B64."
          elif [ -n "$AML_SEED_PAPERS_JSON" ]; then
            printf '%s' "$AML_SEED_PAPERS_JSON" > data/private/aml_seed_papers_core_enriched.json
            echo "Restored AML seed file from AML_SEED_PAPERS_JSON."
          elif [ -f data/private/aml_seed_papers_core_enriched.json ]; then
            echo "Using tracked private AML seed file."
          else
            echo "No AML seed secret found. collect_and_score/full_refresh will fail clearly."
          fi

      - name: Run AML recommendation pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          AML_SEED_PATH: data/private/aml_seed_papers_core_enriched.json
          AML_MODE: ${{ inputs.mode }}
          AML_MAX_CANDIDATES: ${{ inputs.max_candidates }}
          AML_USE_AI_JUDGE: ${{ inputs.use_ai_judge }}
          AML_USE_AI_REASON: ${{ inputs.use_ai_reason }}
          AML_USE_AI_PROFILE: "false"
          CROSSREF_MAX_PAGES: "1"
          API_SLEEP_SECONDS: "1.0"
        run: |
          python scripts/run_aml_recommendation_pipeline.py \
            --mode "${{ inputs.mode }}" \
            --max-candidates "${{ inputs.max_candidates }}"

      - name: Upload AML recommendation artifact
        if: ${{ inputs.publish_output == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: aml-recommended-papers
          path: public/data/aml_recommended_papers.json

      - name: Commit public AML recommendations
        if: ${{ inputs.publish_output == 'true' }}
        run: |
          if git diff --quiet -- public/data/aml_recommended_papers.json; then
            echo "No AML recommendation output changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/aml_recommended_papers.json
          git commit -m "Update AML recommended papers"
          git pull --rebase --autostash origin main
          git push
