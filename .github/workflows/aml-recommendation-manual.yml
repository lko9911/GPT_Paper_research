name: AML Recommendation Manual

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "AML recommendation mode"
        required: true
        default: "score_existing"
        type: choice
        options:
          - score_existing
          - collect_and_score
          - full_refresh
      max_candidates:
        description: "Maximum AML candidate papers to score. Use 0 or blank to score all collected candidates."
        required: false
        default: "0"
      use_ai_judge:
        description: "Use OpenAI relevance judge for ambiguous candidates"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      use_ai_reason:
        description: "Use OpenAI to write public AML recommendation reasons from structured metadata"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      publish_output:
        description: "Commit public AML recommendation output"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      reset_embeddings:
        description: "Reset stored AML embedding vectors before scoring. Use true after changing the seed file."
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aml-recommendation-manual
  cancel-in-progress: false

jobs:
  recommend:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Restore private AML seed file
        env:
          AML_SEED_PAPERS_JSON_B64: ${{ secrets.AML_SEED_PAPERS_JSON_B64 }}
          AML_SEED_PAPERS_JSON: ${{ secrets.AML_SEED_PAPERS_JSON }}
        run: |
          mkdir -p data/private
          if [ -n "$AML_SEED_PAPERS_JSON_B64" ]; then
            printf '%s' "$AML_SEED_PAPERS_JSON_B64" | base64 -d > data/private/aml_seed_papers_core_enriched.json
            echo "Restored AML seed file from AML_SEED_PAPERS_JSON_B64."
          elif [ -n "$AML_SEED_PAPERS_JSON" ]; then
            printf '%s' "$AML_SEED_PAPERS_JSON" > data/private/aml_seed_papers_core_enriched.json
            echo "Restored AML seed file from AML_SEED_PAPERS_JSON."
          elif [ -f data/private/aml_seed_papers_core_enriched.json ]; then
            echo "Using tracked private AML seed file."
          else
            echo "No AML seed secret found. collect_and_score/full_refresh will fail clearly."
          fi

      - name: Reset stored AML embedding vectors
        if: ${{ inputs.reset_embeddings == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "reset_embeddings=true requires OPENAI_API_KEY so the embedding cache can be rebuilt."
            exit 1
          fi
          mkdir -p data/aml_embeddings
          rm -f data/aml_embeddings/aml_seed_embeddings.json
          rm -f data/aml_embeddings/aml_candidate_embeddings.json
          echo "AML embedding vector cache reset requested."

      - name: Run AML recommendation pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          AML_SEED_PATH: data/private/aml_seed_papers_core_enriched.json
          AML_MODE: ${{ inputs.mode }}
          AML_MAX_CANDIDATES: ${{ inputs.max_candidates }}
          AML_USE_AI_JUDGE: ${{ inputs.use_ai_judge }}
          AML_USE_AI_REASON: ${{ inputs.use_ai_reason }}
          AML_USE_AI_PROFILE: "false"
          CROSSREF_MAX_PAGES: "1"
          API_SLEEP_SECONDS: "1.0"
        run: |
          python scripts/run_aml_recommendation_pipeline.py \
            --mode "${{ inputs.mode }}" \
            --max-candidates "${{ inputs.max_candidates }}"

      - name: Enrich AML recommendation OA ranks
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          API_SLEEP_SECONDS: "1.0"
          OPENALEX_RANK_TARGETS: "aml"
        run: python scripts/enrich_openalex_venue_ranks.py

      - name: Upload AML recommendation artifact
        if: ${{ inputs.publish_output == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: aml-recommended-papers
          path: |
            public/data/aml_recommended_papers.json
            data/openalex_source_metrics.json

      - name: Commit public AML recommendations
        if: ${{ inputs.publish_output == 'true' }}
        run: |
          CHANGES="$(git status --porcelain -- public/data/aml_recommended_papers.json data/openalex_source_metrics.json data/aml_embeddings/aml_seed_embeddings.json data/aml_embeddings/aml_candidate_embeddings.json)"
          if [ -z "$CHANGES" ]; then
            echo "No AML recommendation output or embedding cache changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/aml_recommended_papers.json data/openalex_source_metrics.json data/aml_embeddings/aml_seed_embeddings.json data/aml_embeddings/aml_candidate_embeddings.json
          git commit -m "Update AML recommended papers"
          git pull --rebase --autostash origin main
          git push

      - name: Setup Pages
        if: ${{ inputs.publish_output == 'true' }}
        uses: actions/configure-pages@v5

      - name: Build public Pages artifact
        if: ${{ inputs.publish_output == 'true' }}
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "_site" \
            --exclude "private" \
            --exclude "data/private" \
            ./ _site/

      - name: Upload Pages artifact
        if: ${{ inputs.publish_output == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: ${{ inputs.publish_output == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4
